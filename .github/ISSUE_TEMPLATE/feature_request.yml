name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feature suggestion. Please fill out the form so we can understand the ask.

        Before submitting, search [existing feature requests](https://github.com/mitchelljfranklin/mitch-wiki/issues?q=is%3Aissue+label%3Aenhancement).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use-case or pain point this feature addresses.
      placeholder: "I need to export pages in PDF format for compliance audits, but only markdown/HMTL/DOCX export is supported."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What solution would you like?
      description: Describe the feature or change you'd like to see.
      placeholder: "Add a PDF export option on the page menu that uses a headless browser to render the page content."

  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
      description: Workarounds or other approaches you've tried.

  - type: dropdown
    id: scope
    attributes:
      label: What area does this affect?
      options:
        - Editor / Pages
        - Spaces / Organization
        - Authentication / SSO
        - Search
        - API
        - Admin / Settings
        - UI / UX
        - Docker / Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing feature requests and this is not a duplicate
        - label: I am willing to help test or provide feedback on this feature
