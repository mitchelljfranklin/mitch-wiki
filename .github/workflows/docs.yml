name: Docs CI

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"; pinning it here too
        # makes the action fail with "Multiple versions of pnpm specified"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build
